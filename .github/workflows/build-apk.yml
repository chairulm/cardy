name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Cardy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep versionName app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          TAG="v$V-build${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk Cardy.apk
          gh release create "$TAG" Cardy.apk --title "Cardy $V (build ${{ github.run_number }})" --notes "Download **Cardy.apk** below and install on Android 7.0+." --latest
